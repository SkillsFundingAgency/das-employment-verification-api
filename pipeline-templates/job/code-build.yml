parameters:
  TargetProjects: 'src/**/*.csproj'
jobs:
- job: CodeBuild
  pool:
    name: SLD BUILD Pool - CD
    #demands: LATEST_DOTNET_VERSION
    workspace:
      clean: all
  variables:
     
  - group: BUILD Management Resources
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0
    fetchTags: true
    persistCredentials: true

  - template: /azure-pipelines-templates/build/step/gitversion.yml

  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: restore
      projects: ${{ parameters.TargetProjects }}
      vstsFeed: '1d5deb2d-cf8b-4bb1-b147-d13bc246e3f4'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      projects: ${{ parameters.TargetProjects }}
      arguments: '--configuration $(BuildConfiguration)'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet publish'
    inputs:
      command: publish
      publishWebProjects: false
      projects: src/SFA.DAS.EmploymentVerificationService.Functions/SFA.DAS.EmploymentVerificationService.Functions.csproj
      arguments: '--configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)\EmploymentVerificationFunctionApp --no-self-contained'
      modifyOutputPath: false
      zipAfterPublish: false

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Pipeline Artifact'
    inputs:
      targetPath: '$(build.artifactstagingdirectory)\EmploymentVerificationFunctionApp'
      artifact: EmploymentVerificationFunctionApp

