jobs:
- job: UnitTests
  pool:
    name: SLD BUILD Pool - CD
    workspace:
      clean: all
  


  variables:
    BuildConfiguration: 'Release'
    
  steps:
  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: restore
      projects: src/tests/SFA.DAS.EmploymentVerificationService.UnitTests/SFA.DAS.EmploymentVerificationService.UnitTests.csproj
      vstsFeed: '1d5deb2d-cf8b-4bb1-b147-d13bc246e3f4'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      projects: tests/SFA.DAS.EmploymentVerificationService.UnitTests/SFA.DAS.EmploymentVerificationService.UnitTests.csproj
      arguments: '--configuration $(BuildConfiguration)'
      vstsFeed: '1d5deb2d-cf8b-4bb1-b147-d13bc246e3f4'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet test UnitTest Projects'
    inputs:
      command: test
      projects: tests/SFA.DAS.EmploymentVerificationService.UnitTests/SFA.DAS.EmploymentVerificationService.UnitTests.csproj
      arguments: '--filter FullyQualifiedName~UnitTests'

  - task: DotNetCoreCLI@2
    displayName: 'dotnet publish'
    inputs:
      command: publish
      publishWebProjects: false
      projects: tests/SFA.DAS.EmploymentVerificationService.UnitTests/SFA.DAS.EmploymentVerificationService.UnitTests.csproj
      arguments: '--configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)\EmploymentVerificationFunctionUnitTests'
      modifyOutputPath: false
      vstsFeed: '1d5deb2d-cf8b-4bb1-b147-d13bc246e3f4'

  - task: MSBuild@1
    displayName: 'Build solution EmploymentVerificationFunctionUnitTests'
    enabled: true

    inputs:
      solution: 'tests/SFA.DAS.EmploymentVerificationService.UnitTests/SFA.DAS.EmploymentVerificationService.UnitTests.csproj'
      msbuildArchitecture: 'x64'
      platform: '$(BuildPlatform)'
      configuration: '$(BuildConfiguration)'

      msbuildArguments: >
        /p:Version=1.0.0
        /p:AssemblyVersion=1.0.0.0
        /p:FileVersion=1.0.0.0
        /p:InformationalVersion="1.0.0+build.$(Build.BuildId)"
        /p:OutputPath="$(Build.ArtifactStagingDirectory)\EmploymentVerificationFunctionUnitTests"

      clean: true
      maximumCpuCount: true
      logProjectEvents: true
      createLogFile: true

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Pipeline Artifact'
    inputs:
      targetPath: '$(build.artifactstagingdirectory)\EmploymentVerificationFunctionUnitTests'
      artifact: EmploymentVerificationFunctionUnitTests
